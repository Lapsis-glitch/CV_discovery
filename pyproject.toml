[project]
name = "cv-playground"
version = "0.1.0"
description = "Playground for comparing collective-variable discovery methods on MD trajectories"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core numerics
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    # MD I/O
    "MDAnalysis>=2.6",
    "mdtraj>=1.9",
    # Plotting
    "matplotlib>=3.7",
    # Markov / time-lagged analysis
    "deeptime>=0.4",
    # ML collective variables
    "mlcolvar>=0.3",
    # Deep learning
    "torch>=2.1",
    "lightning>=2.1",
    "torch_geometric>=2.4",
    "e3nn>=0.5",
    # Manifold learning
    "pydiffmap>=0.2",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
plumed = ["plumed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_playground"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "ipython>=8.0",
]

